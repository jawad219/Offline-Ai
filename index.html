<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#212121">
<link rel="manifest" href="manifest.json">
<title>Offline AI</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#212121;color:#ececec;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #333}
header b{flex:1;font-size:17px}
select,button{background:#2f2f2f;color:#ececec;border:1px solid #444;border-radius:10px;padding:7px 10px;font-size:14px}
#chat{flex:1;overflow-y:auto;padding:14px;max-width:760px;width:100%;margin:0 auto}
.m{margin:14px 0;display:flex}
.m.u{justify-content:flex-end}
.b{max-width:88%;white-space:pre-wrap;word-wrap:break-word;padding:10px 14px;border-radius:18px}
.u .b{background:#303030}
.a .b{padding-left:0}
pre{background:#111;border-radius:10px;padding:10px;overflow-x:auto;white-space:pre;font-size:13px}
#setup{max-width:520px;margin:auto;text-align:center;padding:24px}
#setup h2{margin:0 0 8px}
#setup p{color:#aaa;font-size:14px}
#bar{height:8px;background:#333;border-radius:8px;overflow:hidden;margin:14px 0 6px;display:none}
#bar i{display:block;height:100%;width:0;background:#10a37f}
#go{background:#10a37f;border:0;color:#fff;padding:12px 22px;font-size:16px;border-radius:12px}
footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0));max-width:760px;width:100%;margin:0 auto;display:none}
.row{display:flex;gap:8px;align-items:flex-end;background:#303030;border-radius:24px;padding:6px 6px 6px 16px}
textarea{flex:1;background:transparent;border:0;outline:0;color:#ececec;font:16px/1.4 inherit;resize:none;max-height:140px;padding:8px 0}
#send{width:38px;height:38px;border-radius:50%;background:#fff;color:#000;border:0;font-size:18px;padding:0}
</style></head>
<body>
<header>
  <b>Offline AI v4</b>
  <select id="model">
    <option value="q05">Fast (0.5B, ~400MB)</option>
    <option value="q15">Behtar (1.5B, ~1GB)</option>
  </select>
  <button id="new" title="New chat">＋</button>
</header>
<div id="chat"></div>
<div id="setup">
  <h2>Offline AI</h2>
  <p>Roman Urdu + English. Model sirf pehli baar download hoga (WiFi use karo), uske baad internet ki zaroorat nahi.</p>
  <button id="go">Model download karo</button>
  <div id="bar"><i></i></div>
  <p id="st"></p>
</div>
<footer id="ft"><div class="row">
  <textarea id="inp" rows="1" placeholder="Kuch bhi poocho..."></textarea>
  <button id="send">↑</button>
</div></footer>

<script type="module">
import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.0/esm/index.js';
const V='https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.0/esm';
const CFG={
  'single-thread/wllama.wasm': V+'/single-thread/wllama.wasm',
  'multi-thread/wllama.wasm': V+'/multi-thread/wllama.wasm',
};
let wllama = new Wllama(CFG);
const MODELS={
  q05:'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf',
  q15:'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf'
};
const SYS="Tum ek helpful AI assistant ho. Agar user Roman Urdu (Urdu English letters mein) likhe to Roman Urdu mein jawab do. Agar English likhe to English mein jawab do. Jawab saaf, seedha aur mukhtasar do.";
const $=id=>document.getElementById(id);
let hist=[],busy=false,ctrl=null,loaded=false;
try{hist=JSON.parse(localStorage.getItem('hist')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('hist',JSON.stringify(hist))}catch(e){}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=t=>t.split('```').map((p,i)=>i%2?'<pre>'+esc(p.replace(/^\w*\n/,''))+'</pre>':esc(p)).join('');
function add(role,text){
  const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');
  const b=document.createElement('div');b.className='b';b.innerHTML=fmt(text);d.appendChild(b);
  $('chat').appendChild(d);$('chat').scrollTop=1e9;return b;
}
hist.forEach(m=>add(m.role,m.content));
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

async function load(){
  $('go').disabled=true;$('bar').style.display='block';$('st').textContent='Load ho raha hai...';
  try{
    const opts={
      n_ctx:1024,n_batch:128,
      progressCallback:({loaded:l,total:t})=>{
        const p=t?Math.round(l/t*100):0;
        $('bar').firstElementChild.style.width=p+'%';
        $('st').textContent='Download: '+p+'% ('+Math.round(l/1048576)+' / '+Math.round(t/1048576)+' MB)';
      }
    };
    let err1='';
    try{
      await wllama.loadModelFromUrl(MODELS[$('model').value],opts);
    }catch(e1){
      err1=String(e1&&e1.message||e1);
      $('st').textContent='Pehli koshish fail ('+err1+'). Dobara load ho raha hai (download nahi hoga)...';
      try{const ks=await caches.keys();for(const k of ks)if(k!=='offline-ai-v3')await caches.delete(k)}catch(_){}
      try{await wllama.exit()}catch(_){}
      wllama=new Wllama(CFG);
      try{
        await wllama.loadModelFromUrl(MODELS[$('model').value],{...opts,n_ctx:512,n_batch:64});
      }catch(e2){
        throw new Error('1) '+err1+' | 2) '+String(e2&&e2.message||e2));
      }
    }
    loaded=true;localStorage.setItem('ready',$('model').value);
    $('setup').style.display='none';$('ft').style.display='block';$('model').disabled=true;
  }catch(e){
    $('st').textContent='Error: '+(e.message||e)+' — internet check karo ya chhota model choose karo.';
    $('go').disabled=false;$('go').textContent='Dobara koshish karo';
  }
}
$('go').onclick=load;
const rd=localStorage.getItem('ready');
if(rd){$('model').value=rd;load();}

async function send(){
  if(busy){ctrl&&ctrl.abort();return}
  const t=$('inp').value.trim();if(!t||!loaded)return;
  $('inp').value='';$('inp').style.height='auto';
  hist.push({role:'user',content:t});add('user',t);
  const out=add('assistant','...');
  busy=true;$('send').textContent='■';ctrl=new AbortController();
  let acc='';
  try{
    const msgs=[{role:'system',content:SYS},...hist.slice(-8)];
    const stream=await wllama.createChatCompletion(msgs,{
      nPredict:512,sampling:{temp:0.7,top_k:40,top_p:0.9},stream:true,abortSignal:ctrl.signal
    });
    for await(const c of stream){acc=c.currentText;out.innerHTML=fmt(acc);$('chat').scrollTop=1e9}
  }catch(e){ if(!acc) out.textContent='Error aa gaya, dobara try karo.'; }
  if(acc){hist.push({role:'assistant',content:acc});save();}
  busy=false;ctrl=null;$('send').textContent='↑';
}
$('send').onclick=send;
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();send()}});
$('inp').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});
$('new').onclick=()=>{if(busy)return;hist=[];save();$('chat').innerHTML=''};
</script>
</body></html>
